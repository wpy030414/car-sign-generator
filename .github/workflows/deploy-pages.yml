name: Deploy to GitHub Pages

# 推送到 main 或手动触发时，构建并发布到 GitHub Pages 项目站点：
# https://<owner>.github.io/car-sign-generator/
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 的最小权限：读仓库、写 Pages、用 OIDC 校验部署来源
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署；新推送不打断进行中的构建
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # 项目站点子路径必须与仓库名一致；vite.config.ts 的 base 从这里读取
        env:
          BASE_PATH: /car-sign-generator/
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
